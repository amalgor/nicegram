[package]
name = "hydra-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libp2p = { workspace = true }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring", "aws_lc_rs"] }
webpki-roots = "0.26"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["tokio", "https-aws-lc-rs", "webpki-roots"] }
protobuf = "3.6"
vpn-link-serde = "0.1.5"
hydra-config = { path = "../hydra-config" }
hydra-p2p = { path = "../hydra-p2p" }
hydra-ai = { path = "../hydra-ai" }
hydra-econ = { path = "../hydra-econ" }
hydra-exchange = { path = "../hydra-exchange" }
libp2p-dns = "0.44.0"
leaf = { git = "https://github.com/eycorsican/leaf", tag = "v0.14.2", default-features = false, features = ["config-json", "outbound-chain", "outbound-reality", "outbound-vless", "outbound-ws"] }
moka = { version = "0.12.14", features = ["future"] }
url = "2.5"
ipnet = "2.10"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = "1"
whois-rust = { version = "1.6", features = ["tokio"] }
regex = "1"
russh = { version = "0.60", default-features = false, features = ["aws-lc-rs", "rsa"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
