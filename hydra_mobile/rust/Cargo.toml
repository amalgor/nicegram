[package]
name = "rust_lib_hydra_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
hydra-config = { path = "../../hydra-config" }
hydra-content = { path = "../../hydra-content" }
hydra-core = { path = "../../hydra-core" }
hydra-ai = { path = "../../hydra-ai" }
hydra-p2p = { path = "../../hydra-p2p" }
hydra-econ = { path = "../../hydra-econ" }
hydra-exchange = { path = "../../hydra-exchange" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
lazy_static = "1.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
alloy = { workspace = true }
chrono = "0.4"
tun2proxy = { git = "https://github.com/tun2proxy/tun2proxy", tag = "v0.7.20" }
moka = { version = "0.12", features = ["sync"] }
reqwest = { version = "0.13.2", default-features = false, features = ["stream", "rustls", "charset", "http2", "json"] }
libp2p = "0.56"
async-trait = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
zeroize = { workspace = true }
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
