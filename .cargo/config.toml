# Android NDK cross-compilation
# NDK 28.2, API level 21 (Android 5.0+)

[env]
ANDROID_NDK_HOME = "/home/user/Android/Sdk/ndk/28.2.13676358"

[target.aarch64-linux-android]
linker = "/home/user/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

[target.armv7-linux-androideabi]
linker = "/home/user/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"

[target.i686-linux-android]
linker = "/home/user/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"

[target.x86_64-linux-android]
linker = "/home/user/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"

# iOS: omit LLVM bitcode (.llvmbc) from the staticlib.
# Rust defaults embed-bitcode=yes; with -force_load, Apple ld must parse every
# object and chokes on bitcode produced by a newer LLVM than Xcode's linker
# ("Unknown attribute kind ..."). We never use LTO/bitcode for the device build,
# so strip it. Applies to device + simulator arm64 (and x86_64 simulator).
[target.aarch64-apple-ios]
rustflags = ["-C", "embed-bitcode=no"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "embed-bitcode=no"]

[target.x86_64-apple-ios]
rustflags = ["-C", "embed-bitcode=no"]
