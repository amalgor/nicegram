[workspace]
members = [
    "hydra-config",
    "hydra-content",
    "hydra-core",
    "hydra-ai",
    "hydra-p2p",
    "hydra-econ",
    "hydra_mobile/rust"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
libp2p = { version = "0.56", features = ["tcp", "dns", "websocket", "noise", "yamux", "kad", "gossipsub", "identify", "macros", "tokio", "mdns", "ping", "request-response", "cbor"] }
libp2p-stream = "0.4.0-alpha"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sled = "0.34"
llama-cpp-2 = "0.1.140"
